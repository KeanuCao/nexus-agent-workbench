; qa/e2e —— 冒烟集合（S1~S5）的 pytest 配置。
; 用例与判据的真源是 docs/test-cases/TC-05.md；定位写法的真源是 docs/design/05-自动化测试.md §7.2。
; 产物路径约定见 qa/e2e/README.md（conftest.py 会把 --output / --alluredir 改写成绝对路径，
; 因此「从哪儿发起 pytest」不影响落点）。

[pytest]
testpaths = smoke
pythonpath = .
cache_dir = artifacts/.pytest_cache

; 失败必留痕：trace（retain-on-failure）+ 整页截图（only-on-failure），落在
; artifacts/playwright/<用例目录>/。成功后不留（要看成功的那几次就临时加 --tracing=on --screenshot=on）。
addopts = -v -ra --strict-markers --tracing=retain-on-failure --screenshot=only-on-failure --full-page-screenshot --output=artifacts/playwright

markers =
    tc(id, title, source_tc): 用例编号、一句话判据与出处（S1~S5 ↔ docs/test-cases/TC-05.md）
