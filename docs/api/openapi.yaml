# =============================================================================
# nexus 后端 API 契约（OpenAPI 3.0.3）
#
# 来源：docs/design/00-环境与部署.md §5.3 + docs/design/01-多租户与认证.md §5 + docs/design/02-统一AI网关.md §3
#      + docs/design/03-RAG知识库.md §3（均已确认设计，契约逐字对齐；人工速查版见同目录 README.md）
# 面向：frontend-engineer（src/api/*.ts 的类型定义以本文件为准）
#
# 约定速记：
#   - 所有接口返回统一响应体 Result<T>：{ code, msg, data }，code === 0 为成功；
#   - 业务异常走 HTTP 200 + code≠0（前端拦截器按 code 判定并弹出 msg）；
#   - HTTP 状态码只用于传输/可用性语义：401 登录态缺失/失效、404 路径不存在、
#     415 请求媒体类型不支持、500 系统异常、503 依赖不可用；
#   - 阶段1 起除白名单（/api/auth/login、/api/health、/actuator/**）外一律需要
#     `Authorization: Bearer <token>`（全局 security 见文件末尾的 securitySchemes）。
# =============================================================================
openapi: 3.0.3

info:
  title: nexus 统一 AI 网关 —— API 契约
  # ⚠️ 本字段是 **OpenAPI 契约文档自身的版本**（OpenAPI 规范要求 info.version 必填），
  #    不是后端产物版本 —— 别拿它去断言 GET /api/health 的 data.version。
  #    后端版本唯一真源 = backend/pom.xml 的 <revision>（运行时见 paths./api/health 里 data.version 的说明）；
  #    0.2.0 是示例值，非真源；实际以 /api/health 的实际返回为准。
  version: 0.2.0
  description: |
    演示项目后端接口契约。阶段0：健康检查；阶段1：多租户 + 认证（登录/登出/取当前用户）；
    阶段2：统一 AI 网关（SSE 流式对话，见 `paths./api/chat/stream`）；
    阶段3：RAG 知识库（上传/列表/删除 + 问答，**同步 JSON**，见 `paths./api/kb/documents` 与 `paths./api/kb/ask`）。

    ## 统一响应体约定
    所有接口（含错误）一律返回 `Result<T>`：

    ```json
    { "code": 0, "msg": "success", "data": { /* 各接口自定义 */ } }
    ```

    - `code === 0`：成功，`data` 为业务数据（`Result.data` 的类型见各接口 schema）；
    - `code !== 0`：失败，`msg` 是可直接展示给前端的文案，`data` 通常为 `null`
      （例外：健康检查 503 时 `data` 仍返回完整报告，便于前端定位故障依赖）。

    ## 错误码（阶段0 + 阶段1 已落地）
    | code | 常量 | HTTP | 含义 |
    | --- | --- | --- | --- |
    | 0 | SUCCESS | 200 | 成功 |
    | 10000 | BUSINESS_ERROR | 200 | 通用业务失败（`BusinessException` 默认码） |
    | 10100 | LOGIN_FAILED | 200 | 用户名或密码错误（**刻意不区分**二者，防账号枚举） |
    | 10101 | ACCOUNT_DISABLED | 200 | 账号已停用（口令正确后才可能返回） |
    | 10102 | TENANT_DISABLED | 200 | 租户已停用 |
    | 20000 | SERVICE_UNAVAILABLE | 503 | 依赖服务不可用（健康检查探活失败） |
    | 40100 | UNAUTHENTICATED | 401 | 未携带 token |
    | 40101 | TOKEN_INVALID | 401 | 登录状态无效（伪造 / 签名错 / Redis 白名单已无该 jti） |
    | 40102 | TOKEN_EXPIRED | 401 | 登录已过期（重新登录即可） |
    | 40400 | NOT_FOUND | 404 | 请求的路径/资源不存在 |
    | 50000 | SYSTEM_ERROR | 500 | 系统异常（详情仅进服务端日志，不返回给前端） |

    编码分段：`1xxxx` 业务 / `2xxxx` 可用性 / `4xxxx` 请求侧 / `5xxxx` 系统。

    ### 阶段2 新增错误码（对话接口，见 `paths./api/chat/stream`）

    | code | 常量 | HTTP | 含义 |
    | --- | --- | --- | --- |
    | 40001 | PARAM_INVALID | **200** | 请求参数不合法（校验失败 / JSON 畸形） |
    | 10200 | CHAT_MODEL_UNSUPPORTED | 200 | 不支持的模型类型（`modelType` 未知取值） |
    | 20100 | CHAT_UPSTREAM_UNAVAILABLE | **503** 或 *流内* | 模型服务暂时不可用：**503 + `Result`** = 本服务的模型线程池已满；**200 + `event: error` 帧** = 上游模型不可达/超时。两种情况都必须处理 |

    > `40001` 配套 HTTP 200 而非 400：见本文件头部「业务失败走 200」的约定与 `docs/api/README.md` §6.4。
    > `20100` 的两种载体是**有意的** —— 池满是同步可判的（能给出真正的 503），
    > 而"上游不可达"只在工作线程上才暴露，那时 `200 + text/event-stream` 的响应头已经发出去了。

    ### 阶段3 新增错误码（知识库接口，见 `paths./api/kb/*`）

    | code | 常量 | HTTP | 含义 |
    | --- | --- | --- | --- |
    | 40003 | FILE_TOO_LARGE | **200** | 上传文件超过 multipart 上限（10MB）。**通用码** —— 约束的是 multipart 请求体本身，任何上传接口都会撞上，故也列在 `docs/api/README.md` §1.3 |
    | 10201 | KB_FILE_TYPE_UNSUPPORTED | 200 | 不支持的文件类型（扩展名不在白名单，或扩展名与内容检测不符） |
    | 10202 | KB_DOCUMENT_NOT_FOUND | 200 | 文档不存在**或不属于当前租户**（两者刻意同形，不给"某 id 是否存在"的探测口） |
    | 10203 | KB_PARSE_EMPTY | 200 | 未能从文件中解析出文本（扫描版 PDF / 空文件 / 编码不可识别 / 加密损坏） |
    | 10204 | KB_CONTENT_TOO_LARGE | 200 | 分块数超过单文档上限（默认 3000），**判在向量化之前** |

    > 五个码都配套 **HTTP 200**：与 `40001` 同一条理由（业务失败不污染前端的失败分支）。
    > 知识库链路的**每个失败点都有确定的 HTTP 载体**（没有 SSE 那样的"响应头已发"问题）——
    > 唯一的非 200 是上游模型不可达：**503 + 20100**（复用既有码），完整表见 `docs/api/README.md` §7.7。
    > ⚠️ `40003` 的 `msg` 里写死了"10MB"，其真源是配置 `spring.servlet.multipart.max-file-size`
    > —— 改配置时要连文案一起改，属已知成本。
    > `10201` 的"仅支持 TXT / PDF"则**没有**这个问题：白名单是后端常量（`TikaDocumentParser`），
    > 与文案同源（初版设计曾想做配置键，实施时改掉 —— 可配的白名单会让写死的文案说谎）。

    ## 认证机制（阶段1）
    1. `POST /api/auth/login` 换取 `data.token`（JWT，有效期 `data.expiresIn` 秒）；
    2. 除白名单（`/api/auth/login`、`/api/health`、`/actuator/**`）外，所有接口都要带
       `Authorization: Bearer <token>`；
    3. 每次请求服务端校验三件事：JWT 签名与有效期 → Redis 白名单里该 `jti` 是否还在 →
       用 token 里的 `tenantId` 建立租户上下文（后续 SQL 自动带 `tenant_id` 条件）；
    4. 任一步失败 → HTTP **401** + 统一 `Result`，前端应清 token 并跳 `/login`；
    5. `POST /api/auth/logout` 会删掉 Redis 中该 `jti` → **同一个 token 立刻失效**。
    6. **Redis 不可用时全员 401**（fail-closed，有意为之）：排查先看 `/api/health` 的 `checks.redis`。

    ## 前端解包路径（对齐 frontend/src/api/request.ts）
    axios 实例 `baseURL = '/api'`，故 `url: '/health'` 即本文件的 `GET /api/health`。
    响应拦截器已把 `Result<T>` 解包为 `data`，业务代码直接拿到 `HealthData`；
    非 0 业务码 / 4xx / 5xx 走 reject 分支，`error.response.data.msg` 可用于提示；
    **401 有专门分支**（清 token + 跳登录），不要与普通业务失败混用同一段处理逻辑。
servers:
  - url: http://localhost:8089
    description: 直连后端（WSL 内容器端口映射到宿主机 8089，端口可经 docker-compose/.env 的 BACKEND_PORT 调整）
  - url: /
    description: 同源相对路径（前端 dev 由 vite.config.ts 代理 /api → localhost:8089；生产由 nginx 反代 /api → nexus-backend:8089）

security:
  # 全局默认：需要 Bearer token（阶段1 起"默认拒绝"）
  # 白名单路径（/api/health、/api/auth/login、/actuator/**）在各自的 operation 上覆盖为 security: []
  - bearerAuth: []

tags:
  - name: Auth
    description: 认证接口（阶段1）：登录换 token、登出使 token 立刻失效、取当前用户
  - name: Chat
    description: |
      对话接口（阶段2）：SSE 流式输出。**响应是事件流而非一次性 JSON**，
      但每帧的 `data` 仍是统一响应体 `Result<T>`。
      ⚠️ 事件帧的完整格式 OpenAPI 3.0.3 描述不了，见 `docs/api/README.md` §6.2。
  - name: Kb
    description: |
      知识库接口（阶段3）：上传 / 列表 / 删除 + 问答。**四个接口全部同步**（不是 SSE），
      返回即代表工作已完成（上传＝已入库、问答＝答案已生成）。
      ⚠️ 本组接口的失败形态与 `Chat` 那组**相反**：每个失败点都有确定的 HTTP 载体，
      详见 `docs/api/README.md` §7.7。边界：一个租户一个知识库、单轮问答、只支持 TXT + PDF。
  - name: System
    description: 系统级接口（健康检查、运行信息），无需鉴权

paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: 登录（换取 JWT）
      description: |
        校验 `username` + `password`，成功后签发 JWT 并把该 token 的 `jti` 写入 Redis 白名单
        （TTL 与 token 有效期一致），使"登出即失效"成为可能。

        **失败一律返回 HTTP 200 + 非 0 业务码**（与全局约定一致，见 `docs/api/README.md` §1.2）：
        - `10100` 用户名或密码错误 —— **刻意不区分**"用户不存在"与"密码错"，防账号枚举，
          前端不得据文案做分支；
        - `10101` 账号已停用（只在口令正确后才可能返回）；
        - `10102` 租户已停用。

        本接口**免鉴权**（登录取不到 token，白名单见 `docs/api/README.md` §1.4）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              admin:
                summary: 默认租户管理员
                value:
                  username: admin
                  password: admin123
      responses:
        '200':
          description: 成功（`code=0`）或业务失败（`code=10100/10101/10102`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultLoginResponse'
              examples:
                success:
                  summary: 登录成功
                  value:
                    code: 0
                    msg: success
                    data:
                      token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIiwianRpIjoiM2Yx...
                      tokenType: Bearer
                      expiresIn: 7200
                      user:
                        userId: 1
                        username: admin
                        nickname: 默认租户管理员
                        tenantId: 1
                        tenantCode: default
                        tenantName: 默认租户
                loginFailed:
                  summary: 用户名或密码错误（HTTP 200 + 业务码）
                  value:
                    code: 10100
                    msg: 用户名或密码错误
                    data: null
                tenantDisabled:
                  summary: 租户已停用
                  value:
                    code: 10102
                    msg: 租户已停用，请联系管理员
                    data: null

  /api/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: 登出（使当前 token 立刻失效）
      description: |
        删除 Redis 白名单中**当前 token** 的 `jti`。删除后同一个 token 再调任何受保护接口都会 401
        —— 这是"纯 JWT 无法登出"的补丁（JWT 本身签发即有效到过期）。

        请求**无 body**（刻意不声明 `consumes`：声明了的话，不带 `Content-Type` 的合法请求会被判 415）。
        幂等：重复登出结果相同（第二次会因 token 已失效而在过滤器处返回 401）。
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: 登出成功（`data` 恒为 null）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
              examples:
                success:
                  value:
                    code: 0
                    msg: success
                    data: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: 取当前用户（服务端校验版）
      description: |
        返回当前 token 对应的用户与租户信息（与登录响应里的 `data.user` 同构）。

        **存在的意义**：登录态以 Redis 白名单为准，"本地存着 token" ≠ "服务端仍认"
        （可能在别处登出、或 Redis 被清）。前端刷新页面后调它做一次真实校验，避免"假登录态"。

        内部还会顺带做一次租户隔离自检：查询自动带 `tenant_id` 条件，
        若 token 里的租户与用户实际所属租户不一致 → 查不到 → 401。
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserInfoVO'
              examples:
                success:
                  value:
                    code: 0
                    msg: success
                    data:
                      userId: 1
                      username: admin
                      nickname: 默认租户管理员
                      tenantId: 1
                      tenantCode: default
                      tenantName: 默认租户
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/chat/stream:
    post:
      tags:
        - Chat
      operationId: streamChat
      summary: 流式对话（SSE）
      description: |
        把会话历史全量上送，后端按 `modelType` 路由到本地 Ollama 或云端 DeepSeek，
        并以 **SSE 事件流**逐片返回生成的文本（打字机效果）。**无状态**：不落库、不建会话表，
        多轮上下文由前端持有 `messages` 数组每次全量上送（刷新即丢）。

        ⚠️ **本接口的响应体不是一次性 JSON**，因此 OpenAPI 只能把它声明为
        `text/event-stream` + `type: string` —— **这是 OpenAPI 3.0.3 的规范限制，不是遗漏**。
        帧的真实结构（四种事件、每条时序规则、失败形态总表）以
        **`docs/api/README.md` §6** 为准，实现与解析约定在设计文档 `docs/design/02-统一AI网关.md` §3。

        ## 事件帧（四种，顺序固定）

        ```
        event: meta
        data: {"code":0,"msg":"success","data":{"modelType":"OLLAMA","model":"qwen2.5:7b","servedBy":"user-selected"}}

        event: delta
        data: {"code":0,"msg":"success","data":{"content":"你"}}

        event: done
        data: {"code":0,"msg":"success","data":{"finishReason":"stop","deltaCount":2,"durationMs":842}}
        ```

        | 事件 | 时机 | `data` 载荷 |
        | --- | --- | --- |
        | `meta` | 第一帧，仅有且必有一帧（在首个 `delta` 之前，只在首次取到上游分片后发出） | `modelType` / `model` / `servedBy` |
        | `delta` | 0~N 帧 | `content`（**增量**片段，不是累积全文 → 前端做追加） |
        | `done` | 正常结束（与 `error` 二选一，有且仅有一个） | `finishReason` / `deltaCount` / `durationMs` |
        | `error` | 异常结束 | `{"deltaCount": N}`（**对象**，不是 `null`） |

        > 上表四种帧的 `data`，在 `components/schemas` 里**各有一个**对应 schema：
        > `ChatStreamMeta` / `ChatStreamDelta` / `ChatStreamDone` / `ChatStreamError`。
        > （OpenAPI 3.0.3 无法把 schema 挂到 SSE 事件上，所以这一行就是"帧表 ↔ schema"的对应关系；
        > 少一个 schema 就意味着按本文件生成类型的人会漏掉那种帧。）

        **每帧的 `data` 仍是统一响应体 `Result<T>`**（`code` / `msg` / `data` 三字段），
        前端可复用与普通接口同一套解包与成功判定（设计决策 D4）。

        ## 三条解析规则（前后端都要遵守）

        1. `meta` 的「开流前」指**对客户端开流前**、非「调用上游前」：在首个上游分片之后、
           第一个 `delta` 之前发出，且只发一次；
        2. 终止帧唯一：`done` **xor** `error`；
        3. 取 `event:` / `data:` 后的值时**先剥掉至多一个前导空格**再 trim ——
           按示例字面 `slice(6)` 会因一个空格匹配不到事件名（页面空白而 curl 正常）；
           行终止符 `\r\n` / `\r` / `\n` 都合法，入缓冲区时先归一。

        ## 失败形态（**全异步口径**）

        `SseEmitter` 一返回，`200 + text/event-stream` 的响应头**已经发出去了**，此后状态码无法再改：

        | 失败点 | 载体 | HTTP | code |
        | --- | --- | --- | --- |
        | 无 token / 过期 / 伪造 | `Result` | 401 | 40100 / 40102 / 40101 |
        | 请求体校验失败 / JSON 畸形 | `Result` | 200 | 40001 |
        | `modelType` 取值未知 | `Result` | 200 | 10200 |
        | **模型线程池已满** | `Result` | **503** | 20100 |
        | 上游不可达 / 超时 / 中途报错 | `event: error` 帧 | *(已是 200)* | 20100 |
        | 未预期的内部异常 | `event: error` 帧 | *(已是 200)* | 50000 |
        | 客户端主动断开 | 无（连接已没了） | — | 服务端据此取消上游调用 |

        前端须同时处理 `20100` 的两种载体：**先看 `Content-Type`**
        （用 `includes('application/json')` 判断：失败形态的 `application/json` 实测带 `;charset=UTF-8`，
        成功形态的 `text/event-stream` 不带 —— 两边形态不一致，全等比较会误判），
        再按帧解析。流的出口有三个：收到 `done`、收到 `error`、**或底层流 EOF**
        （后端崩溃/nginx 断流时不会有终止帧，只认前两个会让页面永久停在"生成中"）。
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            examples:
              singleTurn:
                summary: 单轮提问，指定本地模型
                value:
                  messages:
                    - role: user
                      content: 用三句话介绍杭州
                  modelType: OLLAMA
              multiTurn:
                summary: 多轮（历史全量上送）；`modelType` 缺省 = 由后端决定
                value:
                  messages:
                    - role: user
                      content: 你好
                    - role: assistant
                      content: 你好！有什么可以帮你的？
                    - role: user
                      content: 介绍一下你自己
      responses:
        '200':
          description: |
            成功开流：`Content-Type: text/event-stream`（**裸的，不带 `;charset=UTF-8`**；2026-09-21 实测），
            响应体是 §description 所述的事件流。
            ⚠️ **也为 `code=40001 / 10200` 的业务失败所用** —— 那两种情况下响应体是普通的
            `application/json` + `Result`（`code` 非 0），而不是事件流。
          content:
            text/event-stream:
              # 事件流在 OpenAPI 3.0.3 里没有原生表达方式：只能声明为字符串，
              # 帧的真实结构写在 description 与 docs/api/README.md §6.2。
              schema:
                type: string
                description: |
                  SSE 事件流文本。每帧形如 `event: <名>\ndata: <Result JSON>\n\n`，
                  事件名取值 `meta` / `delta` / `done` / `error`。
                  **请以 `docs/api/README.md` §6.2 为唯一事实源**，不要从本字段的类型反推结构。
              example: |
                event: meta
                data: {"code":0,"msg":"success","data":{"modelType":"OLLAMA","model":"qwen2.5:7b","servedBy":"user-selected"}}

                event: delta
                data: {"code":0,"msg":"success","data":{"content":"你"}}

                event: done
                data: {"code":0,"msg":"success","data":{"finishReason":"stop","deltaCount":1,"durationMs":842}}

            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              examples:
                paramInvalid:
                  summary: 请求体校验失败（HTTP 200，开流前）
                  value:
                    code: 40001
                    msg: 请求参数不合法
                    data: null
                modelUnsupported:
                  summary: modelType 未知取值（HTTP 200，开流前）
                  value:
                    code: 10200
                    msg: 不支持的模型类型
                    data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: |
            模型线程池已满（并发流上限），**开流前**即可判定，故能给出真正的 503。
            上游模型不可达**不会**走这里 —— 那时响应头已发，只能写 `event: error` 帧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              examples:
                executorSaturated:
                  value:
                    code: 20100
                    msg: 模型服务暂时不可用，请稍后重试
                    data: null

  /api/kb/documents:
    get:
      tags:
        - Kb
      operationId: listKbDocuments
      summary: 文档列表（当前租户）
      description: |
        返回当前租户已入库的文档，供页面表格展示。

        **只返回当前租户的文档**：`tenant_id` 条件由 `TenantLineHandler` 自动注入，业务 SQL 里
        不手写（设计决策 D11）—— 跨租户的表现是"看不见"，不是报错（用 `demo` 账号看不到
        `admin` 上传的文档，这是正确行为）。

        `total` 与 `items.length` 本轮**恒等**（无分页）；仍保留 `total` 是为了将来加分页时不改契约。
        ⚠️ **排序未约定**：契约不保证 `items` 顺序，前端不要依赖（需要固定顺序时自行排序）。
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: 成功（`data` 为 `KbDocumentListVO`）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KbDocumentListVO'
              examples:
                ok:
                  summary: 当前租户有一份文档
                  value:
                    code: 0
                    msg: success
                    data:
                      items:
                        - documentId: 7
                          fileName: 公司年报.pdf
                          fileType: PDF
                          fileSize: 1048576
                          charCount: 12480
                          chunkCount: 28
                          createdAt: '2026-09-22T10:30:00+08:00'
                      total: 1
                empty:
                  summary: 当前租户还没有文档（页面空态）
                  value:
                    code: 0
                    msg: success
                    data:
                      items: []
                      total: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Kb
      operationId: uploadKbDocument
      summary: 上传文档（**同步**：返回即已入库）
      description: |
        上传一份 TXT / PDF：后端在**请求线程**上完成 解析 → 分块 → 向量化 → 入库（单事务），
        返回 200 时全部已完成（设计决策 D7 的同步口径）。`data.chunkCount` 即本次写入的分块数。

        ## 请求形状的三条硬约定（踩了就是 40001 或一次超时误判）

        1. **字段名必须是 `file`**（multipart 里只有一个 part）；写错 → `MissingServletRequestPartException`
           → `40001`；
        2. **上传必须让请求头是带 boundary 的 `multipart/form-data`**（⚠️ 2026-09-22 实测订正）：
           实例默认头 `Content-Type: application/json` 会让 axios 把 `FormData` **转成 JSON 字符串**
           （body 变成 `{"file":{}}`，**文件字节不会发出**），"`data` 是 `FormData` 就删掉该头"那段
           因此**不执行** ⇒ 后端按 `consumes` 在**映射阶段**拒收（客户端侧失败形态见
           `docs/api/README.md` §7.7）。故要**显式声明 `headers: { 'Content-Type': 'multipart/form-data' }`**
           （axios 的浏览器适配器会把它删掉、由浏览器补 boundary；**绝不要自己拼 `; boundary=…`**）。
           （前端若用 `el-upload`，还要用 `:http-request` 自定义，否则它的默认 XHR 绕过拦截器）；
        3. **超时 ≠ 失败**：上传耗时取决于文件大小与 CPU（数十秒~两分钟量级）。前端要逐请求覆盖超时
           （**上传 300s**，见 `docs/api/README.md` §7.1 约定 3；验收夹具 587 块上传**实测 131.9 s**
           —— 2026-09-22 经 8088 端到端实测，两次一致：129.75 s / 131.9 s，向量化 37 批 ≈ 3.6 s/批；
           原定的 120s 太贴边，实测值已越过它。⚠️ **耗时随机器负载漂移，只当参考记录值**，
           判据只有 **< 300 s** 这一条上界），
           超时文案写成"服务端可能仍在处理，请刷新列表确认后再重试"——直接重传会留下两份同名文档
           （重名不去重是已知行为）。

        ## 失败形态

        全部为 **HTTP 200 + 非 0 业务码**（见 examples 与 `docs/api/README.md` §7.7）；唯一的例外是
        **向量化时 Ollama 不可达 → HTTP 503 + `20100`**（事务回滚，文档不落库）。
        ⚠️ "文件超过 10MB"返回 `40003` 这一格**待实测**：Tomcat 的 `max-swallow-size` 可能让超限请求
        表现为"连接被重置"而不是这个码（设计 §6.2 记了该风险与判据）。

        ## 改配置的连带后果

        本轮**不保存原始文件**（决策 D8）⇒ 改 `nexus.ai.rag.chunk-size` / `chunk-overlap` 之后，
        已入库的文档无法重新分块，**必须重传**才生效。
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    单个文件。扩展名 `.txt` / `.pdf`（大小写不敏感），**按扩展名 + 内容检测双重判断**
                    （设计决策 D12：只看扩展名会被改后缀骗过，只看内容则区分不出 `.txt` 是否真是文本）；
                    大小 ≤ 10MB（上限真源 = `spring.servlet.multipart.max-file-size`）。
                  example: 公司年报.pdf
      responses:
        '200':
          description: |
            成功：**已入库**（`data` 为 `KbDocumentVO`）。
            ⚠️ **本响应也承载全部业务失败**（HTTP 200 + 非 0 码）：`40001` / `40003` / `10201` /
            `10203` / `10204`，见下方 examples；此时 `data` 为 `null`。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        description: 成功时是 `KbDocumentVO`；业务失败时是 `null`（业务码见同一响应的 examples）
                        nullable: true
                        allOf:
                          - $ref: '#/components/schemas/KbDocumentVO'
              examples:
                ok:
                  summary: 上传成功（已入库）
                  value:
                    code: 0
                    msg: success
                    data:
                      documentId: 7
                      fileName: 公司年报.pdf
                      fileType: PDF
                      fileSize: 1048576
                      charCount: 12480
                      chunkCount: 28
                      createdAt: '2026-09-22T10:30:00+08:00'
                paramInvalid:
                  summary: 缺 `file` 字段 / 文件为空 / 请求不是 multipart（缺 Content-Type 或 boundary）
                  value:
                    code: 40001
                    msg: 请求参数不合法
                    data: null
                fileTooLarge:
                  summary: 文件超过 10MB（**待实测**：也可能表现为连接被重置）
                  value:
                    code: 40003
                    msg: 文件过大，最大支持 10MB
                    data: null
                fileTypeUnsupported:
                  summary: 扩展名不在白名单 / 扩展名与内容检测不符
                  value:
                    code: 10201
                    msg: 不支持的文件类型，仅支持 TXT / PDF
                    data: null
                parseEmpty:
                  summary: 解析不出文本（扫描版 PDF / 空文件 / 编码不可识别）
                  value:
                    code: 10203
                    msg: 未能从文件中解析出文本（可能是扫描版 PDF 或空文件）
                    data: null
                contentTooLarge:
                  summary: 分块数超过 3000（判在向量化之前）
                  value:
                    code: 10204
                    msg: 文档内容过长，超出单文档分块上限，请拆分后上传
                    data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: |
            向量化时上游（Ollama）不可达 / 超时 / 报错：**整个上传失败并回滚**（文档不落库），
            不会留下"半份文档"。与 `Chat` 那组不同，本链路同步，所以能给出真正的 503。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              examples:
                embeddingUnavailable:
                  value:
                    code: 20100
                    msg: 模型服务暂时不可用，请稍后重试
                    data: null

  /api/kb/documents/{documentId}:
    delete:
      tags:
        - Kb
      operationId: deleteKbDocument
      summary: 删除文档（连带其全部分块）
      description: |
        删除一份文档，**其全部分块与向量一并删除**（`t_kb_chunk.document_id` 上带 `ON DELETE CASCADE`，
        级联由数据库保证，业务代码不做两次删除）。

        ## 两个刻意的约定

        1. **文档不存在时不返回 404，而是 HTTP 200 + `10202`**：本项目的 HTTP 状态码只承载
           传输/可用性语义（见文件头部约定），业务拒绝一律 200 + 业务码。
           且**另一个租户的文档与"不存在"完全同形**（都返回 `10202`）—— 这是有意的：
           区分开就等于给出一个"某 id 是否存在"的探测口。
        2. 删除**无法恢复**：本轮不保存原始文件，删掉就重灌不出那一批分块 ——
           前端二次确认的文案要写明这一点。
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - name: documentId
          in: path
          required: true
          description: 文档 ID（取自列表接口的 `data.items[].documentId`）
          schema:
            type: integer
            format: int64
          example: 7
      responses:
        '200':
          description: |
            成功：`code=0` + `data=null`（注意**成功时 `data` 也是 `null`**，前端不要以"有没有 data"判成败）；
            文档不存在或不属于当前租户时同样是 HTTP 200，但 `code=10202`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              examples:
                ok:
                  summary: 删除成功
                  value:
                    code: 0
                    msg: success
                    data: null
                notFound:
                  summary: 文档不存在 **或不属于当前租户**（两者同形）
                  value:
                    code: 10202
                    msg: 文档不存在或已被删除
                    data: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/kb/ask:
    post:
      tags:
        - Kb
      operationId: askKb
      summary: 知识库问答（**同步**：返回即答案已生成）
      description: |
        问题 → 向量化 → 在**当前租户的全部文档**里做向量 TopK 检索 → 拼 Prompt → 复用阶段2 的统一
        网关生成答案 → 连同**引用片段**一起返回（设计决策 D6：同步 JSON，不是 SSE）。

        ## 三条补充约束

        1. **`topK` 越界返回 `40001` + 可读文案**（不是 Bean Validation 的英文消息）：后端用 `Integer`
           承接、业务侧判边界，因为 `@Min/@Max` 的默认消息会被前端拦截器直接弹给用户；
        2. **`question` 的上限按字符计（500），与对话接口的 8KB 字节口径不同是刻意的**：那个口径防的是
           "误贴大段文本撑爆上游上下文"，而问题天然是短的；
        3. **问题不带任何"文档范围"参数**：本轮检索范围 = 当前租户的全部文档（一个租户一个知识库，
           多知识库是 backlog）。

        ## 检索不到时**不调用大模型**

        `grounded=false` 表示检索（阈值筛完后）0 条命中 —— 此时后端**短路返回固定文案**，
        不消耗上游额度，也不存在"编一个答案"的可能。答案的三种闸门（相似度阈值 → 空结果短路 →
        prompt 约束）见设计 §2 的 D9。

        ⚠️ `sources[].content` 与 `answer` 都是用户上传的外部文本，前端必须用插值渲染
        （`{{ }}` / `v-text`），**绝不用 `v-html`**。
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KbAskRequest'
            examples:
              withTopK:
                summary: 指定 topK
                value:
                  question: 去年利润是多少
                  topK: 5
              defaultTopK:
                summary: 不带 topK（用后端配置值，默认 5）
                value:
                  question: 去年利润是多少
      responses:
        '200':
          description: |
            成功（`data` 为 `KbAnswerVO`）：`grounded=true` 时带引用片段与 `generation` 观测块；
            `grounded=false` 时 `sources` 为空数组、`generation` 为 **`null`**（没调模型）。
            ⚠️ 本响应也为 `40001`（校验失败）所用。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KbAnswerVO'
              examples:
                grounded:
                  summary: 检索到资料并生成了答案
                  value:
                    code: 0
                    msg: success
                    data:
                      answer: 根据资料，去年（2025 年）净利润为 1.23 亿元 [资料1]。
                      grounded: true
                      sources:
                        - documentId: 7
                          fileName: 公司年报.pdf
                          chunkIndex: 12
                          score: 0.8241
                          content: 2025 年度归属于母公司股东的净利润为 123,000,000.00 元……
                      retrieval:
                        topK: 5
                        hits: 1
                        threshold: 0.5
                        durationMs: 48
                      generation:
                        modelType: DEEPSEEK
                        model: deepseek-chat
                        durationMs: 4034
                notGrounded:
                  summary: 检索不到（未调用大模型）—— 注意 sources 是空数组、generation 是 null
                  value:
                    code: 0
                    msg: success
                    data:
                      answer: 知识库中未找到相关内容，请换一种问法，或先上传相关文档。
                      grounded: false
                      sources: []
                      retrieval:
                        topK: 5
                        hits: 0
                        threshold: 0.5
                        durationMs: 31
                      generation: null
                paramInvalid:
                  summary: question 为空/超长，或 topK 越界（不在 1..20）
                  value:
                    code: 40001
                    msg: 请求参数不合法
                    data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: |
            上游模型不可达 / 超时 / 报错（`question` 的向量化、或答案的生成）。
            ⚠️ **生成失败不降级**：即使检索结果已经拿到，也整体失败 —— 返回"引用片段有、答案空"的响应
            会让前端把"没答"与"检索不到"（`grounded=false`）混淆，把排查方向带偏（契约 §7.7）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              examples:
                upstreamUnavailable:
                  value:
                    code: 20100
                    msg: 模型服务暂时不可用，请稍后重试
                    data: null

  /api/health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: 健康检查（依赖真实连通性探测）
      description: |
        对各依赖做**真实**连通性探测（设计文档 §5.3：不造假 —— 这是面试演示链路的第一步）：

        | 依赖 | 探测方式 |
        | --- | --- |
        | postgres | 取一次 JDBC 连接并执行 `SELECT 1` |
        | redis | 发送 `PING`，比对响应是否为 `PONG` |
        | ollama | 请求 `GET /api/version`，有响应体即视为可用（不校验模型是否已拉取） |

        语义说明：
        - **HTTP 200**：三个依赖全部 UP，`data.status = UP`；
        - **HTTP 503**：任一依赖 DOWN，`data.status = DOWN`，响应体结构不变 ——
          `msg` 提示"依赖服务不可用：postgres"（可展示），`data.checks` 保留完整探测结果，
          前端既可直接弹 `msg`，也可从 `data.checks` 定位具体故障依赖；
        - 依赖不可用**不会导致后端启动失败**（Hikari 池不做初始连接尝试），
          因此容器起来后本接口仍是可用入口，只是返回 503。

        请求约定：无请求体、无查询参数、无鉴权要求（`security: []`）。
        另有容器级探活入口 `GET /actuator/health`（Spring Boot Actuator，返回格式非 `Result`，
        仅供 docker-compose healthcheck 与运维使用，前端**不要**调用）。
      security: []
      parameters: []
      responses:
        '200':
          description: 全部依赖可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultHealthReport'
              examples:
                allUp:
                  summary: 依赖全部可用
                  value:
                    code: 0
                    msg: success
                    data:
                      status: UP
                      service: nexus-start
                      # 示例值，非真源；实际以 /api/health 的实际返回为准
                      # （真源 = backend/pom.xml 的 <revision>，见 docs/api/README.md §4.2.2）
                      version: 0.2.0
                      timestamp: '2026-09-03T10:00:00+08:00'
                      checks:
                        postgres: UP
                        redis: UP
                        ollama: UP
        '503':
          description: 依赖探活失败（任一 checks 为 DOWN）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultHealthReport'
              examples:
                postgresDown:
                  summary: postgres 不可达，redis / ollama 正常
                  value:
                    code: 20000
                    msg: 依赖服务不可用：postgres
                    data:
                      status: DOWN
                      service: nexus-start
                      # 示例值，非真源；实际以 /api/health 的实际返回为准
                      version: 0.2.0
                      timestamp: '2026-09-03T10:00:00+08:00'
                      checks:
                        postgres: DOWN
                        redis: UP
                        ollama: UP
                allDown:
                  summary: 依赖全部不可达（如未执行 up.sh 时的空环境）
                  value:
                    code: 20000
                    msg: 依赖服务不可用：postgres、redis、ollama
                    data:
                      status: DOWN
                      service: nexus-start
                      # 示例值，非真源；实际以 /api/health 的实际返回为准
                      version: 0.2.0
                      timestamp: '2026-09-03T10:00:00+00:00'
                      checks:
                        postgres: DOWN
                        redis: DOWN
                        ollama: DOWN

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        登录接口返回的 `data.token`。用法：`Authorization: Bearer <token>`。
        服务端每次请求校验 ①JWT 签名与有效期 ②Redis 白名单中该 `jti` 是否仍在
        （登出/被清即为失效）。失败返回 HTTP 401 + `40100/40101/40102`。

  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      description: 形如 `Bearer <token>`（注意 Bearer 后有**一个空格**）
      schema:
        type: string
      example: Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0.abc123

  responses:
    Unauthorized:
      description: |
        登录态缺失或失效。**响应体仍是统一 `Result`**（HTTP 401 是给前端 401 分支用的传输层信号）：

        | code | msg | 触发场景 |
        | --- | --- | --- |
        | 40100 | 未登录，请先登录 | 没带 `Authorization: Bearer` 头 |
        | 40101 | 登录状态无效，请重新登录 | token 签名/格式非法，或 Redis 白名单里已无该 jti（已登出 / Redis 被清 / Redis 不可用） |
        | 40102 | 登录已过期，请重新登录 | token 的 `exp` 已过 |

        前端处置：清 store 中的 token → 跳 `/login?redirect=<当前路径>`（并发多请求同时 401 时只跳一次）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
          examples:
            unauthenticated:
              summary: 未携带 token（40100）
              value:
                code: 40100
                msg: 未登录，请先登录
                data: null
            tokenInvalid:
              summary: token 非法或已登出（40101）
              value:
                code: 40101
                msg: 登录状态无效，请重新登录
                data: null
            tokenExpired:
              summary: token 已过期（40102）
              value:
                code: 40102
                msg: 登录已过期，请重新登录
                data: null

  schemas:

    # ── 统一响应体外壳（泛型 Result<T> 的通用部分）──
    Result:
      type: object
      description: 统一响应体外壳，所有接口共用；`data` 的具体结构由各接口定义
      required:
        - code
        - msg
      properties:
        code:
          type: integer
          format: int32
          description: 响应码：0 = 成功，非 0 = 失败（错误码表见 info.description）
          example: 0
        msg:
          type: string
          description: 提示信息：成功固定为 `success`；失败为可直接展示给前端的文案
          example: success
        data:
          description: 业务数据；失败且无数据时为 `null`
          nullable: true

    # ── GET /api/health 的 data 定义（前端 HealthData）──
    ResultHealthReport:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/HealthReport'

    HealthReport:
      type: object
      description: |
        健康检查报告 —— 即 `Result.data`（设计文档 §5.3 契约，字段顺序固定）。
        对应前端 `frontend/src/api/health.ts` 的 `HealthData`。
      required:
        - status
        - service
        - version
        - timestamp
        - checks
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/DependencyStatus'
          description: 总体状态：三个依赖全部 UP 才是 UP，任一 DOWN 即为 DOWN
        service:
          type: string
          description: 服务名，取自配置 `nexus.health.service-name`
          example: nexus-start
        version:
          type: string
          description: |
            服务版本号，取自配置 `nexus.health.version` —— 构建期由 Maven 资源过滤把
            `@project.version@` 替换成 **`backend/pom.xml` 的 `<revision>`**（版本号唯一真源，发版只改这一行）。
            **不要**把期望值写死成某个具体版本号；要防「版本号改了、产物却没跟着变」必须比对 `<revision>`
            （取真源值：`grep -o '<revision>[^<]*</revision>' backend/pom.xml`；判据与历史故障见
            `docs/api/README.md` §4.2.2）。
          # 示例值，非真源；实际以 /api/health 的实际返回为准
          example: 0.2.0
        timestamp:
          type: string
          format: date-time
          description: |
            生成时刻，ISO-8601 带时区偏移，格式固定为 `yyyy-MM-dd'T'HH:mm:ssXXX`
            （秒级精度、无小数秒）。偏移量取服务端默认时区。
            ⚠️ **零偏移渲染成 `Z` 而不是 `+00:00`**（2026-09-22 实测：容器内是
            `2026-09-22T12:59:02Z`，本地直跑是 `+08:00`）—— 两者都是合法的 ISO-8601，
            消费方**不要断言时区**（`scripts/check-health.sh` 本就如此）。
            前端按字符串展示即可，需要 Date 对象时可 `new Date(timestamp)`。
          example: '2026-09-03T10:00:00+08:00'
        checks:
          $ref: '#/components/schemas/HealthChecks'

    HealthChecks:
      type: object
      description: 各依赖的真实连通性探测结果；取值只有 `UP` / `DOWN`
      required:
        - postgres
        - redis
        - ollama
      properties:
        postgres:
          allOf:
            - $ref: '#/components/schemas/DependencyStatus'
          description: Postgres 探活：取 JDBC 连接执行 `SELECT 1`
        redis:
          allOf:
            - $ref: '#/components/schemas/DependencyStatus'
          description: Redis 探活：`PING` 得到 `PONG`
        ollama:
          allOf:
            - $ref: '#/components/schemas/DependencyStatus'
          description: Ollama 探活：`GET /api/version` 返回响应体

    DependencyStatus:
      type: string
      description: 探活状态。枚举名即 JSON 取值，与前端 `HealthStatus = 'UP' | 'DOWN'` 一致
      enum:
        - UP
        - DOWN

    # ── POST /api/chat/stream 的请求体（对应后端 dto/ChatRequest + dto/ChatMessage）──
    # ── 认证接口（阶段1：POST /api/auth/login|logout、GET /api/auth/me）──
    #   ⚠️ 这 6 个 schema **从阶段1 起一直是缺失的**：LoginRequest / ResultLoginResponse /
    #      ResultVoid / ResultUserInfoVO 这 4 个 $ref 悬空（README §5 的字段表却一直是完整的
    #      ⇒ 两份契约不同步）。2026-09-22 由阶段3 实施复核发现并补齐，见 README §8 变更记录。
    #      字段以 README §5.2 / §5.4 为准，并与 nexus-module-system 的 DTO 逐一核对过。
    LoginRequest:
      type: object
      description: |
        登录请求体（契约：`docs/api/README.md` §5.2）。对应后端 `com.nexus.module.system.dto.LoginRequest`。
        **刻意不带校验注解**：登录接口的契约是"失败一律 200 + 10100"（防账号枚举），
        若在入参上做 Bean Validation，空口令会先被抛成 `40001`，与契约不符。
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: 登录名，**全局唯一**（登录只收用户名：先查出用户，才知道它属于哪个租户）
          example: admin
        password:
          type: string
          description: 明文口令（服务端只做 BCrypt 比对；空值按 `10100` 处理）
          example: admin123

    UserInfoVO:
      type: object
      description: |
        当前用户信息（契约：`docs/api/README.md` §5.2 / §5.4）。对应后端 `UserInfoVO` record。
        `POST /api/auth/login` 的 `data.user` 与 `GET /api/auth/me` 的 `data` **同构**（就是同一个类）。
      required:
        - userId
        - username
        - nickname
        - tenantId
        - tenantCode
        - tenantName
      properties:
        userId:
          type: integer
          format: int64
          description: 用户 ID
          example: 1
        username:
          type: string
          description: 登录名
          example: admin
        nickname:
          type: string
          nullable: true
          description: 展示名（**可为 `null`**）
          example: 默认租户管理员
        tenantId:
          type: integer
          format: int64
          description: 租户 ID
          example: 1
        tenantCode:
          type: string
          description: 租户编码（`default` / `demo`）
          example: default
        tenantName:
          type: string
          description: 租户名称（前端展示用）
          example: 默认租户

    LoginResponse:
      type: object
      description: 登录成功的数据（契约：`docs/api/README.md` §5.2）。对应后端 `LoginResponse` record。
      required:
        - token
        - tokenType
        - expiresIn
        - user
      properties:
        token:
          type: string
          description: 'JWS 紧凑序列化串；之后每个请求带 `Authorization: <tokenType> <token>`'
        tokenType:
          type: string
          description: |
            目前恒为 `Bearer`。前端拼 `Authorization: ${tokenType} ${token}` —— **用返回值而非硬编码**
            （行为等价，但更贴合 RFC 6750 的语义）。⚠️ 本字段在本仓库曾同时写着"固定 Bearer"与
            "不要硬编码"两种口径，已按**用返回值**收口（见 README 头部与 §5.2）。
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: 有效期（秒），与 Redis 白名单 TTL 一致
          example: 7200
        user:
          $ref: '#/components/schemas/UserInfoVO'

    ResultLoginResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/LoginResponse'

    ResultUserInfoVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/UserInfoVO'

    ResultVoid:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              nullable: true
              description: 恒为 `null` —— 登出没有业务数据（契约 §5.3）

    ChatRequest:
      type: object
      description: |
        对话请求体（契约：`docs/api/README.md` §6.1）。**无状态**：多轮上下文由前端
        每次全量上送 `messages`，后端不落库（刷新即丢，前端应给用户提示）。
      required:
        - messages
      properties:
        messages:
          type: array
          minItems: 1
          description: |
            会话历史全量上送。至少 1 条，**最后一条必须是 `role=user`**。
            **允许连续同角色**：失败/停止后前端回滚该轮 assistant 消息后，数组会以 `user` 结尾，
            下一次提问再 push 一条 `user` 即成连续两条 —— 契约允许，无需特殊处理。
          items:
            $ref: '#/components/schemas/ChatMessage'
        modelType:
          type: string
          nullable: true
          description: |
            模型类型。**`null` 或缺省 = 由后端决定**（本轮解析为后端默认模型，`meta.servedBy` 会是 `default`）。
            未知取值 → `10200`（HTTP 200，开流前）。
            后端 DTO 刻意用 `String` 承接再由 `ModelType.parse()` 转枚举：若直接声明为枚举，
            Jackson 遇未知值会抛 `HttpMessageNotReadableException` → 500 + 50000，而不是契约要的 `10200`。
          enum:
            - OLLAMA
            - DEEPSEEK
          example: OLLAMA

    ChatMessage:
      type: object
      description: 一条会话消息（契约：`docs/api/README.md` §6.1）
      required:
        - role
        - content
      properties:
        role:
          type: string
          description: 消息角色。本阶段**不支持** `system`（提示词模板管理不在阶段2 范围内）
          enum:
            - user
            - assistant
        content:
          type: string
          description: |
            消息正文。非空、去空白后非空；**单条上限 8KB、所有消息合计 64KB**（按 UTF-8 字节数计，
            超出 → `40001`）。上限防的是误贴大段文本把上游上下文撑爆。
          example: 用三句话介绍杭州

    # ── 事件帧的 data 载荷（**四种帧各一个 schema**，与 README.md §6.2 的帧表逐项对应）──
    #    对应后端 dto/ChatStreamMeta / ChatStreamDelta / ChatStreamDone / ChatStreamError
    #    注意：这几个 schema 只描述帧内 data 的结构，完整帧形如 `event: X\ndata: Result<X>\n\n`
    ChatStreamMeta:
      type: object
      description: |
        `event: meta` 帧的 `data`。**第一帧、仅有且必有一帧**，在首个 `delta` 之前发出。
        它保证"模型在有内容之前就已定下"，也是「后端自动选模型」的预留位（`servedBy`）。

        ⚠️ 「必有」只对**成功路径**成立：**上游一个字都没吐就失败**时这条流只有一帧 `error`
        （`meta` 的语义是"这次用了哪个模型"，而上游根本没给出响应）。
        **前端不要断言"第一帧一定是 meta"** —— 那会让"上游不可用"这种正常失败变成解析异常。
      required:
        - modelType
        - model
        - servedBy
      properties:
        modelType:
          type: string
          description: 实际使用的模型类型（枚举名）
          enum:
            - OLLAMA
            - DEEPSEEK
        model:
          type: string
          description: 上游**真实模型名**（用于验收"传 OLLAMA/DEEPSEEK 分别命中对应实现"）
          example: qwen2.5:7b
        servedBy:
          type: string
          description: |
            谁选的模型：`user-selected` = 请求里带了 `modelType`；`default` = 请求里没带，
            后端取了 `nexus.ai.default-model`。
            ⚠️ **刻意不声明为 `enum`**：它是"本轮会出现的取值"，不是"协议冻结的取值集合"。
            自动路由上线后还会出现 `fallback`（设计文档 `docs/design/02-统一AI网关.md` §10.1），
            而紧 enum 会让前端在一个**纯展示字段**上突然解析失败 —— 展示字段的容错优先于严格。
          example: user-selected

    ChatStreamDelta:
      type: object
      description: |
        `event: delta` 帧的 `data`。0~N 帧，是回答正文的唯一载体。
      required:
        - content
      properties:
        content:
          type: string
          description: |
            **增量**文本片段（**不是累积全文**）—— 前端做**追加**，不做替换
            （写成替换的表现是"屏幕上永远只有最后一个字"）。单帧可能只有一个汉字。
            空串是"上游这一拍没吐字"，服务端直接跳过，因此**不会出现空内容的 delta 帧**。
          example: 你

    ChatStreamDone:
      type: object
      description: |
        `event: done` 帧的 `data`。正常结束帧，与 `error` **互斥**（有且仅有一个终止帧），
        发出后服务端立即 `complete()`。
      required:
        - finishReason
        - deltaCount
        - durationMs
      properties:
        finishReason:
          type: string
          description: |
            `stop` 模型正常结束；`length` 触达 token 上限；`timeout` 被**服务端软上限**截断
            （后端自己的定时任务，早于 emitter 硬超时触发）。
          enum:
            - stop
            - length
            - timeout
        deltaCount:
          type: integer
          format: int32
          description: 本次共发出多少帧 `delta`
          example: 87
        durationMs:
          type: integer
          format: int64
          description: 从开始到结束的毫秒数
          example: 8420

    ChatStreamError:
      type: object
      description: |
        `event: error` 帧的 `data`。**形状定死为对象**（而不是 `null`）：
        前端靠 `deltaCount` 知道"已经吐了多少字"，据此决定保留还是回滚这一轮。
        （普通的 `Result.failure(code, msg)` 产生的 `data` 是 `null`，故 error 帧专设本结构。）
      required:
        - deltaCount
      properties:
        deltaCount:
          type: integer
          format: int32
          description: 出错前已经发出的 `delta` 帧数；一个都没发出时为 `0`
          example: 12

    # ── 阶段3 知识库的四个接口（Kb*，契约：docs/api/README.md §7.1~§7.6）──
    #    对应后端 com.nexus.module.ai.rag.dto 下的五个类型
    #    （四个 record：KbDocumentVO / KbDocumentListVO / KbAnswerVO / KbSourceVO，一个可变 POJO：KbAskRequest）。
    #    ⚠️ `Result<T>` 的包装在这里是**内联 allOf**（与 HealthReport 的 ResultHealthReport 写法不同）——
    #    为了不给每个接口多造一个 wrapper schema；语义完全等价：data 的类型就是下面的 schema。
    KbDocumentVO:
      type: object
      description: |
        一份已入库的文档（契约：`docs/api/README.md` §7.5）。
        **上传响应与列表项同构** —— 前端只需要写一个类型。
      required:
        - documentId
        - fileName
        - fileType
        - fileSize
        - charCount
        - chunkCount
        - createdAt
      properties:
        documentId:
          type: integer
          format: int64
          description: 文档 ID（删除接口的路径参数）
          example: 7
        fileName:
          type: string
          description: 原始文件名。**仅回显，不落盘**（本轮不保存原始文件，见设计决策 D8）
          example: 公司年报.pdf
        fileType:
          type: string
          description: 文件类型（大写，由扩展名归一化而来）
          enum:
            - TXT
            - PDF
        fileSize:
          type: integer
          format: int64
          description: 上传字节数
          example: 1048576
        charCount:
          type: integer
          format: int32
          description: |
            解析出的正文字符数 —— **排查解析质量的第一眼数据**：与预期量级差太远（如只有几百字）
            就说明解析出了问题。空内容 / 扫描版 PDF 会在入库之前就被 `10203` 拦掉，不会走到这里。
          example: 12480
        chunkCount:
          type: integer
          format: int32
          description: 入库的分块数（即"单文档 3000 块"上限判据的实测值）
          example: 28
        createdAt:
          type: string
          format: date-time
          description: |
            入库时间，格式与 `/api/health` 的 `timestamp` **同款**：`yyyy-MM-dd'T'HH:mm:ssXXX`
            （秒级、无小数秒）。偏移量随服务端时区。
            ⚠️ **零偏移渲染成 `Z` 而不是 `+00:00`**（2026-09-22 实测）：容器内是 `2026-09-22T02:30:00Z`，
            本地直跑是 `+08:00` —— `Z` 与 `+00:00` 是等价的 ISO-8601 写法，**判据不要写死 `+00:00`**。
          example: '2026-09-22T10:30:00+08:00'

    KbDocumentListVO:
      type: object
      description: |
        文档列表（契约：`docs/api/README.md` §7.2）。
        `total` 与 `items.length` 本轮**恒等**（无分页），保留 `total` 只为将来加分页时不改契约。
        ⚠️ **排序未约定**：前端不要依赖 `items` 的顺序。
      required:
        - items
        - total
      properties:
        items:
          type: array
          description: 当前租户的文档（跨租户的看不见 —— `tenant_id` 条件由拦截器自动注入，设计决策 D11）
          items:
            $ref: '#/components/schemas/KbDocumentVO'
        total:
          type: integer
          format: int32
          description: 文档总数（本轮 = `items.length`）
          example: 3

    KbAskRequest:
      type: object
      description: 知识库问答请求体（契约：`docs/api/README.md` §7.4）
      required:
        - question
      properties:
        question:
          type: string
          description: |
            问题文本。非空、去空白后非空；**≤ 500 字符**（按**字符**计，不是字节 ——
            与对话接口的 8KB 字节口径不同是刻意的，理由见契约 §7.4）。超出 → `40001`。
          example: 去年利润是多少
        topK:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 20
          description: |
            本次检索取回的分块数。**缺省 / `null` = 用后端配置值**（`nexus.ai.rag.top-k`，默认 5）；
            取值域 `1..20`，越界 → `40001`（后端刻意用 `Integer` 承接、业务侧判边界：
            `@Min/@Max` 的英文默认消息会被前端拦截器直接展示给用户）。
          example: 5

    KbAnswerVO:
      type: object
      description: |
        问答响应（契约：`docs/api/README.md` §7.6）。
        `grounded=false` 时三件事同时成立：`answer` 是后端**固定文案**、`sources` 是**空数组**（不是 `null`）、
        `generation` 是 **`null`**（检索为空 ⇒ 未调用大模型）。
      required:
        - answer
        - grounded
        - sources
        - retrieval
        - generation
      properties:
        answer:
          type: string
          description: |
            模型生成的答案；`grounded=false` 时是固定文案
            「知识库中未找到相关内容，请换一种问法，或先上传相关文档。」（后端常量，前端不必自己拼）。
            ⚠️ 与 `sources[].content` 同属**用户上传的外部文本**，必须插值渲染，**绝不用 `v-html`**。
          example: 根据资料，去年（2025 年）净利润为 1.23 亿元 [资料1]。
        grounded:
          type: boolean
          description: |
            答案是否**基于检索到的资料**。`false` = 阈值筛完后 0 条命中 ⇒ **未调用大模型**
            —— 这是"检索不到就说不知道"的结构性保证（空结果短路，设计决策 D9 的第二道闸）。
          example: true
        sources:
          type: array
          description: 引用片段，按 `score` **降序**；`grounded=false` 时为空数组（不是 `null`）
          items:
            $ref: '#/components/schemas/KbSourceVO'
        retrieval:
          type: object
          description: |
            检索侧观测值。**排查顺序**：先看这里（`hits=0` ⇒ 阈值/检索问题），
            再看 `sources[].content` 本身乱不乱（乱 = 解析问题，不乱 = 检索或阈值问题）。
          required:
            - topK
            - hits
            - threshold
            - durationMs
          properties:
            topK:
              type: integer
              format: int32
              description: 本次生效的 topK（请求里带的就是它，没带则是配置值 `nexus.ai.rag.top-k`）
              example: 5
            hits:
              type: integer
              format: int32
              description: 过相似度阈值的条数（= `sources.length`；为 `0` 时 `grounded=false`）
              example: 1
            threshold:
              type: number
              format: double
              description: |
                本次生效的相似度阈值（`nexus.ai.rag.score-threshold`）。
                初值 0.5 是**起点不是结论，必须标定**（步骤见设计 §3.9），标定结果回写 TC-03。
              example: 0.5
            durationMs:
              type: integer
              format: int64
              description: 检索耗时（含问题的向量化），毫秒
              example: 48
        generation:
          type: object
          nullable: true
          description: |
            生成侧观测值；**`grounded=false` 时为 `null`**（没调模型，所以没有可报的数字）。
            前端要按"可为 null"处理，不要直接取 `.model`。
          required:
            - modelType
            - model
            - durationMs
          properties:
            modelType:
              type: string
              description: 实际使用的模型类型（枚举名），取值由 `nexus.ai.rag.answer-model-type` 决定
              enum:
                - OLLAMA
                - DEEPSEEK
            model:
              type: string
              description: 上游**真实模型名**
              example: deepseek-chat
            durationMs:
              type: integer
              format: int64
              description: 生成耗时，毫秒
              example: 4034

    KbSourceVO:
      type: object
      description: |
        一条引用片段（契约：`docs/api/README.md` §7.6）。`content` 是**分块原文**：
        引用即原文，不截断、不摘要 —— 这是"答案可当场核对"的前提。
      required:
        - documentId
        - fileName
        - chunkIndex
        - score
        - content
      properties:
        documentId:
          type: integer
          format: int64
          description: 来源文档 ID
          example: 7
        fileName:
          type: string
          description: 来源文件名（展示用；该文件并不落盘）
          example: 公司年报.pdf
        chunkIndex:
          type: integer
          format: int32
          description: 该分块在文档内的序号，**0 起** ⇒ 前端展示「第 N 段」时用 `chunkIndex + 1`
          example: 12
        score:
          type: number
          format: double
          description: |
            余弦相似度 = `1 - (embedding <=> query)`，**保留 4 位小数**；取值域 `[-1, 1]`，结果按它降序。
            阈值在**应用层**过滤 —— 写进 SQL 的 `WHERE` 会让 HNSW 近似索引失效（设计 §4.6 第 2 条）。
          example: 0.8241
        content:
          type: string
          description: |
            该分块的原文。段落内的换行原样保留 ⇒ 渲染要 `white-space: pre-wrap`
            （否则会被压成一整行，看起来像"解析坏了"）。属**用户上传的外部文本**，
            必须插值渲染，**绝不用 `v-html`**。
          example: 2025 年度归属于母公司股东的净利润为 123,000,000.00 元……
