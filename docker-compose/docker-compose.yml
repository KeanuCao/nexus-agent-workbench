# =============================================================================
# nexus 基础设施编排（task.1 / 0.1 交付物）
#
# 关键约定（与 docs/design/00-环境与部署.md §2 严格一致）：
#   1. 镜像加速：image: 直写 docker.m.daocloud.io 前缀（官方镜像走 /library/ 路径），
#      严禁修改 /etc/docker/daemon.json —— 加速配置随仓库走、任何干净机器可复现。
#   2. 仅在 WSL 发行版 nexus-agent-workbench 内的 docker/compose 执行。
#   3. 宿主端口全部经 .env 变量化（改一处生效）；容器内端口固定，
#      健康检查与 nginx 反代不随宿主端口漂移。
#   4. builder 走 profiles: ["build"]，不进默认 up -d 服务图。它是**手工启停**的常驻容器：
#        docker compose up -d builder      # 需要打包时启动
#        docker compose exec builder <命令> # 在里面手工执行 git-sync / build-* / db-patch-migrate
#        docker compose stop builder       # 用完停掉
#      它自己 git pull 源码（不挂载宿主源码），仓库地址由 .env 的 NEXUS_REPO_URL/BRANCH 配置。
#   5. 数据一律命名卷（WSL ext4），不用 bind mount 映射 /mnt/c 数据目录（9p 性能/权限风险）。
#   6. **产物走共享卷**：builder 把 jar / 前端静态文件写到命名卷 build-artifacts，
#      nexus-backend / nexus-frontend 只读挂载同一个卷。
#      ⚠️ 后果：运行镜像**不再自包含** —— 产物还没生成时，前后端容器会启动失败。
#         所以「裸 docker compose up -d」不再是可靠入口，请走 scripts/up.sh（它保证顺序）。
#
# 用法（0.3 由 scripts/up.sh 封装，现阶段人工执行）：
#   wsl -d nexus-agent-workbench -- bash -c "cd /mnt/c/wp/nexus-agent-workbench/docker-compose && docker compose up -d"
#   （compose 自动发现同目录 .env；从仓库根目录调用时加 -f docker-compose/docker-compose.yml）
# =============================================================================
name: nexus

services:
  # ─────────────────────────── 基础设施 ───────────────────────────
  postgres:
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-nexus}
      POSTGRES_USER: ${PG_USER:-nexus}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-nexus123}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-nexus} -d ${PG_DB:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nexus-net

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    # dev 不设密码：仅容器内网 + 本机端口映射；生产需 requirepass（取舍记录见设计文档 §2.1）
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - nexus-net

  ollama:
    image: docker.m.daocloud.io/ollama/ollama:${OLLAMA_TAG:-latest}
    container_name: nexus-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    # CPU 推理（2026-09-03 已确定）。GPU 直通预留（需 nvidia-container-toolkit + 驱动）：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - nexus-net

  # 一次性模型拉取：复用 ollama 镜像客户端模式（服务与 CLI 同镜像），
  # 脚本先 ollama list 判存在则跳过 —— 重复 up -d 幂等、不重复下载（设计文档 §2.5）。
  ollama-init:
    image: docker.m.daocloud.io/ollama/ollama:${OLLAMA_TAG:-latest}
    container_name: nexus-ollama-init
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # 幂等判断（2026-09-12 修正）：
        #   ollama list 的 NAME 列对**未指定 tag** 的模型显示为 `name:latest`
        #   （如 nomic-embed-text:latest），而 model 变量不带 tag
        #   → 原写法 `awk '{print $1}' | grep -qx "${model}"` 要求整行相等，**必然匹配不上**
        #   → 跳过分支对第二个模型永久失效，每次 up -d 都会重新 pull（外网依赖 + 假失败风险）。
        #   修法：在列表侧剥离 :latest 再比；NR>1 顺带跳过表头。sub 有则剥、无则不动，
        #   对自带 tag 的 qwen2.5:7b 无影响，两种显示格式都能命中。
        for model in qwen2.5:7b nomic-embed-text; do
          if ollama list | awk 'NR>1 {sub(/:latest$$/, "", $$1); print $$1}' | grep -qx "$${model}"; then
            echo "[ollama-init] 模型 $${model} 已存在，跳过"
          else
            echo "[ollama-init] 开始拉取模型 $${model} ..."
            ollama pull "$${model}"
          fi
        done
        echo "[ollama-init] 模型就绪：qwen2.5:7b / nomic-embed-text"
    networks:
      - nexus-net

  # ─────────────────────────── 打包容器（手工启停的常驻容器） ───────────────────────────
  # nexus-builder：git + mvn 3.9/JDK17 + node 20 + postgresql-client（见 builder/Dockerfile）。
  # 2026-09-13 按新宪法重建：不再挂载宿主源码（容器内自己 git pull），不再作为前后端镜像的
  # 构建阶段（产物改为落 build-artifacts 卷），从"用完即销毁"改为"手工启停"。
  #
  # profiles 隔离仍然保留 —— 作用是让**裸 `docker compose up -d` 不会拉起它**；
  # 显式点名（`up -d builder`）照样会激活 profile（2026-09-11 已实测该行为）。
  #
  # 刻意**不写 depends_on: postgres**：只有 db-patch-migrate 需要数据库，
  # 而 build-backend / build-frontend 不需要。绑上去会让"只想编译一下"也得先等 PG 就绪。
  # 真去跑迁移而 PG 没起时，脚本会以明确的连接错误退出（fail-fast，不静默）。
  builder:
    image: nexus-builder:dev
    profiles: ["build"]
    build:
      context: ./builder
      dockerfile: Dockerfile
    container_name: nexus-builder
    restart: "no"
    # 常驻但不干活，等着被 exec 进去执行命令（CLAUDE.md：手工启动、手工执行）
    command: ["sleep", "infinity"]
    environment:
      # ── 源码同步（容器内 git 拉取；只能拿到【已 push】的提交）──
      NEXUS_REPO_URL: ${NEXUS_REPO_URL:-https://github.com/KeanuCao/nexus-agent-workbench.git}
      NEXUS_REPO_BRANCH: ${NEXUS_REPO_BRANCH:-main}
      NEXUS_REPO_DIR: /workspace/repo
      # ── 产物共享目录（与 nexus-backend / nexus-frontend 挂的是同一个卷）──
      NEXUS_ARTIFACT_DIR: /artifacts
      # ── db-patch 迁移连库参数 ──
      # ⚠️ 这里是【容器内端口 5432】，不是 .env 的 PG_PORT（那是宿主映射端口）。
      #    与「8088 是宿主端口 / 80 是容器内端口」同一类陷阱，写混了会连不上。
      NEXUS_PG_HOST: postgres
      NEXUS_PG_PORT: "5432"
      NEXUS_PG_DB: ${PG_DB:-nexus}
      NEXUS_PG_USER: ${PG_USER:-nexus}
      NEXUS_PG_PASSWORD: ${PG_PASSWORD:-nexus123}
    volumes:
      # 容器内的 git 工作区。放命名卷（而不是让容器每次重 clone）是为了
      # `docker compose down` 之后工作区仍在，增量 pull 与增量编译才有意义。
      # 注意：这份 clone **只是构建副本**，宿主仓库仍是开发真源。
      - builder-src:/workspace
      # Maven 本地仓库：不缓存的话每次构建要重新下 150MB+ 依赖。
      # ⚠️ 挂载点必须是 /root/.m2/repository —— 挂 /root/.m2 会遮蔽镜像层里的
      #    settings.xml（阿里云源），Maven 便静默回落到境外中央仓库。
      - builder-m2:/root/.m2/repository
      # npm 全局缓存
      - builder-npm:/root/.npm
      # ★ 产物共享目录：本容器写，前后端容器只读挂
      - build-artifacts:/artifacts
    networks:
      - nexus-net

  # ─────────────────────────── 应用容器 ───────────────────────────
  # 2026-09-13 起：镜像里**不再**包含应用产物（原先由 stage 1 的 mvn/npm 构建后 COPY 进来），
  # 产物改为从共享卷 build-artifacts 读取。因此构建上下文只需 Dockerfile 一个文件，
  # 构建是秒级的 —— 此处原本那套「dockerfile 相对 context 解析」的绕行写法也随之失去必要。
  nexus-backend:
    image: nexus-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8089}:8089"
    environment:
      # 容器内端口固定 8089（与健康检查/nginx 反代一致）；改宿主端口只动 .env 的 BACKEND_PORT
      SERVER_PORT: "8089"
      # ── 数据源 / Redis：地址与凭据全部来自 .env（唯一真源）──
      # 补上这组变量的原因：此前它们只喂给 postgres 容器，后端走的是 application.yml
      # 的默认值（恰好相同所以连得上）。一旦有人改 .env 里的 PG_PASSWORD，后端就会连不上、
      # checks.postgres 变 DOWN —— 这笔债记在 docs/api/README.md §4.7 第 3 条。
      # ⚠️ 端口用【容器内】端口 5432 / 6379，不是 .env 的 PG_PORT / REDIS_PORT（那是宿主映射端口）。
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${PG_DB:-nexus}
      POSTGRES_USER: ${PG_USER:-nexus}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-nexus123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      # 只读挂载产物共享目录；jar 由 builder 容器写入（产物缺失时有可读报错，见 Dockerfile）
      - build-artifacts:/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /actuator/health：Spring Boot Actuator 探活（0.4 落地，业务接口为 /api/health）
      test: ["CMD-SHELL", "wget -qO- localhost:8089/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - nexus-net

  nexus-frontend:
    image: nexus-frontend:dev
    build:
      # 2026-09-13 起：镜像里不再包含前端产物（原先由 stage 1 的 npm build 后 COPY 进来），
      # 静态文件改为从共享卷 build-artifacts 读取。
      # 因为不需要再引入仓库里的 frontend/ 源码目录，additional_contexts 也一并去掉 ——
      # nginx.conf 与 Dockerfile 同处本目录，直接 COPY 即可。
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    volumes:
      # 只读挂载产物共享目录；nginx 的 root 指向 /artifacts/frontend（见 nginx.conf）
      - build-artifacts:/artifacts:ro
    depends_on:
      nexus-backend:
        condition: service_healthy
    healthcheck:
      # ⚠️ 必须写 127.0.0.1，不能写 localhost（2026-09-12 修正）：
      #    容器内 localhost 优先解析到 ::1(IPv6)，而 nginx 默认只监听 IPv4
      #    → Connection refused → 容器**恒 unhealthy**（实测 FailingStreak 已达 184）。
      #    容器内实测对照：wget -qO- localhost → exit=1；wget -qO- 127.0.0.1 → exit=0。
      #    这是**假故障**：服务本身完全正常（宿主 curl :8088 与反代 /api/health 均 200）。
      test: ["CMD-SHELL", "wget -qO- 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - nexus-net

# ─────────────────────────── 网络与命名卷 ───────────────────────────
# 单一自定义 bridge：容器间用服务名互访，不依赖宿主 DNS（设计文档 §2.1）
networks:
  nexus-net:
    name: nexus-net
    driver: bridge

# 命名卷落在 WSL ext4（避开 /mnt/c 9p 性能坑）；name 固定，避免随项目名/目录漂移
volumes:
  pg-data:
    name: pg-data
  redis-data:
    name: redis-data
  ollama-models:
    name: ollama-models
  # ── builder 相关（2026-09-13 新增）──
  # builder-src：容器内的 git 工作区（不是宿主源码的映射）
  builder-src:
    name: builder-src
  # builder-m2 / builder-npm：依赖缓存，避免每次构建重新下载 150MB+ 依赖
  builder-m2:
    name: builder-m2
  builder-npm:
    name: builder-npm
  # build-artifacts：★ 产物共享目录 —— builder 写，nexus-backend / nexus-frontend 只读挂
  #   布局：/artifacts/backend/app.jar、/artifacts/frontend/**
  #   想查看里面有什么：docker run --rm -v build-artifacts:/a alpine ls -lR /a
  build-artifacts:
    name: build-artifacts
