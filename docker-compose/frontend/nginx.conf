# =============================================================================
# nexus-frontend nginx 站点配置（与 Dockerfile 同目录，直接 COPY 进镜像）
# 职责：静态托管 Vite 产物 + /api 反代后端容器（compose 网络内服务名直连）
#
# ⚠️ root 自 2026-09-13 起指向**共享卷挂载点** /artifacts/frontend，
#    不再是从镜像层里 COPY 进来的 /usr/share/nginx/html。
#    产物由 builder 容器写入（docker compose exec builder build-frontend）。
#    挂载点为空时 nginx 照常启动，但所有请求 404 —— 那不是配置错，是还没构建。
# =============================================================================
server {
    listen       80;
    server_name  _;

    root   /artifacts/frontend;
    index  index.html;

    # gzip：静态资源压缩，降低传输量与首屏时间（面试展示点）
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA history 路由回退：直达子路由/刷新不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代（保留 /api 前缀，与后端 Controller 映射一致；
    # 端口为容器内固定值 8089，宿主端口变化不影响此处）
    location /api/ {
        proxy_pass http://nexus-backend:8089;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout  300s;  # AI 接口长耗时/流式输出预留
        proxy_send_timeout  300s;
    }
}
