# =============================================================================
# report-nginx 站点配置（5.5 交付，2026-10-10）
#   compose 把命名卷 nexus-test-report 以**只读**方式挂到 /usr/share/nginx/html，
#   卷根即站点根。卷内布局（真源 = docs/design/05-自动化测试.md §7.4.2；
#   写方 = scripts/py/finalize-run.py）：
#     /index.html          本次运行的**落地页**（结论 + Allure 报告入口 + 失败留痕直链）
#     /allure-report/      本次 Allure HTML（报告首页 = /allure-report/index.html）
#     /allure-results/     allure-pytest 的原始 JSON（本次报告就是由它生成的）
#     /playwright/<用例>/  失败留痕：trace.zip + test-failed-1.png（仅失败保留）
#     /run-results.json    最近一次运行的结构化结果
#     /runs/<run_id>.json  同上的历史副本
#     /deploy-summary.json 部署八步摘要（存在才收，来自 deploy.py --summary-json）
#
#   为什么站点根是「落地页」而不是 Allure 报告本身（取舍，别随手改）：
#     ① 失败留痕进不了 Allure 报告 —— qa/e2e 的 conftest 只记账、不 attach（它是 5.5 的只读边界），
#        而验收要求「点进失败用例的 trace/截图」⇒ 必须有一个能给出直链的页面，报告做不到；
#     ② 卷刚发布/被清空时（如首次 up -d 前后），站点也要有一个稳定可开的页面；
#     ③ 落地页由收尾脚本按本次 run-results.json 生成，比报告首页多一层"这次是什么结论"。
#   若坚持「打开 12008 直达 Allure 报告首页」，把下面的 `location = /` 改成
#     return 302 /allure-report/;
#   即可 —— 代价是失去失败留痕入口（①②两条理由作废）。此处按落地页实现。
# =============================================================================
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    # 探活专用：只看 nginx 本身，与"卷里有没有报告"解耦
    # （compose 的 healthcheck 打这里 —— 卷空 / 报告未发布时它依然稳定 200，
    #   不会把"内容还没发布"伪装成"容器起不来"）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 站点内容：卷根开始按路径直接取（报告是纯静态 SPA，相对路径在子目录里照常成立）。
    # 不开启 autoindex —— 入口收敛到落地页，不把卷内容当目录索引暴露。
    location / {
        try_files $uri $uri/ =404;
    }
}
