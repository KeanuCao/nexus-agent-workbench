# =============================================================================
# report-nginx 站点配置（5.5 交付，2026-10-10；报告按 run_id 并存，2026-10-11；截图口径订正 2026-10-13）
#   compose 把命名卷 nexus-test-report 以**只读**方式挂到 /usr/share/nginx/html，
#   卷根即站点根。卷内布局（真源 = docs/design/05-自动化测试.md §7.4.2；
#   写方 = scripts/py/finalize-run.py）：
#     /index.html                    卷根**索引页**（最近一次结论摘要 + 历史运行列表）
#     /run-results.json              最新一次运行的结构化结果
#     /runs/<run_id>/index.html      该次运行的**落地页**（结论 + Allure 入口 + 失败留痕直链）
#     /runs/<run_id>/allure-report/  该次 Allure HTML（报告首页 = …/allure-report/index.html）
#     /runs/<run_id>/allure-results/ 该次 allure-pytest 原始 JSON（该次报告由它生成）
#     /runs/<run_id>/playwright/…    该次失败留痕：trace.zip + test-failed-1.png（仅失败保留）
#     /runs/<run_id>/run-results.json / deploy-summary.json  该次结果与部署摘要
#
#   ★ nginx 配置本身**不需要**随"按 run 并存"改动：卷根即站点根，`try_files` 对
#     runs/<run_id>/ 子目录与其相对链接照常成立（无 rewrite / 无 alias）。
#     本次只改了本头注里的布局说明（布局变了，注释别留旧版）。
#
#   为什么站点根是「索引页」而不是 Allure 报告本身（取舍，别随手改）：
#     ① 失败留痕（trace.zip + 失败整页截图）进不了 Allure 报告 —— conftest 不 attach 它们
#        （用例**前后**截图自 2026-10-13 起已 attach，但那两张不是失败现场）；
#        而验收要求「点进失败用例的 trace/截图」⇒ 必须有一个能给出直链的页面，报告做不到；
#     ② 卷刚发布/被清空时（如首次 up -d 前后），站点也要有一个稳定可开的页面；
#     ③ 报告按 run 并存后，Allure 报告**没有单一地址** ⇒ 站点根给出历史入口；
#        每次运行的结论摘要由收尾脚本按其 run-results.json 生成。
#   若坚持「打开 12008 直达某次报告」：只能重定向到索引页或某个固定 run
#     （location = / 里 return 302 … 即可 —— 没有"最新报告"的稳定地址）——
#     代价是失去失败留痕入口（①②两条理由作废）。此处按索引页实现。
# =============================================================================
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    # 探活专用：只看 nginx 本身，与"卷里有没有报告"解耦
    # （compose 的 healthcheck 打这里 —— 卷空 / 报告未发布时它依然稳定 200，
    #   不会把"内容还没发布"伪装成"容器起不来"）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 站点内容：卷根开始按路径直接取（报告是纯静态 SPA，相对路径在子目录里照常成立）。
    # 不开启 autoindex —— 入口收敛到落地页，不把卷内容当目录索引暴露。
    location / {
        try_files $uri $uri/ =404;
    }
}
