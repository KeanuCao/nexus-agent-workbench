# =============================================================================
# nexus-start 应用配置（task.1 / 0.4 交付物）
#
# 约定（与 docs/design/00-环境与部署.md §2.1 / §5.3 一致）：
#   1. 容器内端口固定 8089 —— 与 docker-compose/backend/Dockerfile 的 EXPOSE、
#      docker-compose.yml 的健康检查与 nginx 反代保持一致；宿主端口由 .env 的
#      BACKEND_PORT 控制，容器内不变。
#   2. 数据源 / Redis 默认指向 compose 网络内的服务名（postgres / redis），
#      本地（Windows 宿主机）开发时用环境变量覆盖为 localhost，无需改本文件。
#   3. `${...:默认值}` 由 Spring 解析，不会被 Maven 资源过滤（spring-boot-starter-parent
#      已配置 resource.delimiter=@ 且 useDefaultDelimiters=false，见其 POM）；
#      而 `@project.version@` 正是 Maven 过滤占位符，打包时替换为 pom 中的版本号。
#   4. 依赖不可达不得阻塞启动：Hikari initialization-fail-timeout=-1（池不做初始连接尝试），
#      各探活超时兜底 —— 探测失败只体现为 /api/health 的 checks 标 DOWN + HTTP 503。
# =============================================================================
server:
  port: ${SERVER_PORT:8089}
  # 优雅停机：容器 stop 时先摘流量再退，避免正在处理的请求被硬断（配合下面的 lifecycle 超时）
  shutdown: graceful

spring:
  application:
    name: nexus-start

  # ── 数据源（PostgreSQL 16 + pgvector，容器内服务名 postgres）──
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nexus}
    username: ${POSTGRES_USER:nexus}
    password: ${POSTGRES_PASSWORD:nexus123}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: nexus-hikari-pool
      maximum-pool-size: 10
      minimum-idle: 2
      # 获取连接的最长等待：健康检查探活靠它兜底，不可设得比探活超时更长
      connection-timeout: 3000
      validation-timeout: 2000
      # 关键：< 0 表示池启动时不做初始连接尝试（Hikari 语义），
      # 数据库不可达时应用照常启动 —— "探活失败 ≠ 启动失败"的技术落点
      initialization-fail-timeout: -1

  # ── Redis 7（容器内服务名 redis；dev 不设密码，见设计文档 §2.1 取舍记录）──
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      connect-timeout: 2000ms
      timeout: 2000ms
      lettuce:
        shutdown-timeout: 100ms

  lifecycle:
    # 优雅停机的等待上限，超时强制退出（容器 stop 默认 10s 宽限期，故取更小的 20s 上限亦安全）
    timeout-per-shutdown-phase: 20s

  # ── MVC 异步（阶段2 流式对话）──
  mvc:
    async:
      # 异步请求（SseEmitter）的总时长上限，毫秒。不配则走容器默认值，长回答会被**中途切断**。
      # 与 nexus.ai.stream-timeout-ms 同量级：ChatService 构造 SseEmitter 时显式传后者，
      # 不依赖这里的全局默认值兜底（两处同源，避免"配了个值却不生效"）。
      request-timeout: 300000

  # ── 文件上传（阶段3 知识库：POST /api/kb/documents 的 multipart 上限）──
  servlet:
    multipart:
      # ★ 必须显式配：Spring Boot 的 max-file-size 默认是 **1MB**。
      #   不配的话一份 2MB 的年报 PDF 会直接失败（表现为 40003，或 §6.2 记的"连接被重置"）。
      #   这是"配置漏了、症状却像代码 bug"的典型：1MB 以下的上传全部正常，一过线就报错 ——
      #   本值是"单文件 10MB"这个业务上限的**唯一真源**，服务层刻意不重复判一遍。
      max-file-size: 10MB
      # 请求总体上限比 file-size 大一档：multipart 信封（boundary、各 part 的头部）本身要占字节，
      # 两者取相同值时"刚好 10MB 的文件"会被信封顶出去而失败
      max-request-size: 12MB
      # ⚠️ 待实测（刻意先不配）：Tomcat 默认只"吞掉"约 2MB 的超限请求体，超出部分会让容器直接断连，
      #    症状是"上传 11MB 文件时连接被重置"而不是 40003。判据：故意传一个 11MB 的文件看拿到哪个；
      #    若为连接错误，再在 server: 段加 max-swallow-size: 12MB（或 -1 表示不限制）。
      #    本条与上面 ai.* / rag.* 一样**不在** compose 的 environment 里，改了同样要重打包 + 重启。

# ── MyBatis-Plus：阶段0 只接入依赖、不写 Mapper；多租户拦截器 / 分页 / 主键策略在阶段1 按设计文档补充 ──
mybatis-plus:
  global-config:
    # 关闭 MP 启动横幅，保持日志干净（面试演示时日志里只留业务链路）
    banner: false
  configuration:
    # 下划线列名 → 驼峰属性名（t_xxx 表字段风格统一，阶段1 起大量使用）
    map-underscore-to-camel-case: true

# ── Actuator：容器健康检查入口（docker-compose healthcheck 调 /actuator/health）──
management:
  endpoints:
    web:
      exposure:
        # 只暴露 health / info：演示项目也不该把 env、beans 等内部信息敞开
        include: health,info
  endpoint:
    health:
      # 演示项目：展示各 health indicator 明细（db / redis / diskSpace 等），
      # 便于面试时讲解"容器级健康 vs 业务级健康"两层探活的区别
      show-details: always

info:
  app:
    name: ${spring.application.name}
    # 引号原因同上：YAML 保留字符 '@' 不能作为未加引号标量的首字符
    version: "@project.version@"
    description: nexus 统一 AI 网关演示项目 —— 启动模块

# info.* 属性默认不对外暴露（Boot 2.6+ 安全默认值），显式打开，让 /actuator/info 可读
management.info.env.enabled: true

# ── 业务自定义配置 ──
nexus:
  health:
    # 响应体 data.service / data.version（契约：docs/design/00-环境与部署.md §5.3）
    service-name: nexus-start
    # Maven 资源过滤注入 pom 版本号：版本号单一来源，避免硬编码漂移。
    # 必须加引号 —— YAML 中 '@' 是保留字符，不能作为未加引号标量的首字符，
    # 否则 SnakeYAML 直接报 "found character '@' that cannot start any token"
    version: "@project.version@"
    # 单个依赖探活超时（毫秒）：HTTP 连接/读取超时、JDBC statement 超时均由此换算
    probe-timeout-ms: 2000
    ollama:
      # 容器内服务名；Windows 本地开发用 OLLAMA_BASE_URL=http://localhost:11434 覆盖
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
      # Ollama 版本接口：能返回即证明进程可用（不校验模型是否已拉取，那是 up.sh 的职责）
      version-path: /api/version

  # ── JWT（阶段1 认证；绑定见 JwtProperties）──
  jwt:
    # 签名密钥（HS256 要求至少 32 字节）。⚠️ 下面这串是**随仓库公开的 dev 默认值**，
    # 任何非本地环境都必须用环境变量 NEXUS_JWT_SECRET 覆盖，否则等于公开签名密钥。
    # 密钥太短/为空时 jjwt 会抛异常，应用**启动即失败**（有意的 fail-fast，详见 JwtUtil）。
    secret: ${NEXUS_JWT_SECRET:nexus-dev-only-jwt-secret-please-override-in-any-real-environment}
    # 有效期（秒），同时也是 Redis 白名单的 TTL（两者必须一致）；7200 = 2 小时
    expire-seconds: 7200

  # ── 统一 AI 网关（阶段2；绑定见 com.nexus.module.ai.gateway.config.AiProperties）──
  ai:
    # modelType 缺省（null）时用哪个 provider（决策 D6）；取值即 ModelType 枚举名。
    # 注意：本键与下面几个 base-url / model 键**都不在** docker-compose 的 nexus-backend.environment 里
    # —— 在 .env 里改它们容器收不到，只能改本文件的默认值（= 重打包 + 重启后端）。
    # 唯一例外是 DEEPSEEK_API_KEY，它走 compose 的 env_file（直接注入容器，不经过 compose 插值）。
    default-model: ${NEXUS_AI_DEFAULT_MODEL:OLLAMA}
    # emitter 硬超时（毫秒）：到点连接直接结束，**发不出任何帧**。
    # ChatService 构造 SseEmitter 时显式传它，与上面 spring.mvc.async.request-timeout 同源。
    stream-timeout-ms: 300000
    # 服务端软上限（毫秒）：自己的定时任务，在硬超时**之前**触发，发 done 且 finishReason=timeout。
    # 两者必须留出间隔（如 290s / 300s），否则软上限永远来不及发。
    soft-timeout-ms: 290000
    # 上游"两次读之间"的空闲超时（毫秒），**不是**流的总时长。
    # 刻意不沿用 nexus.health.ollama.probe-timeout-ms（2000）—— 那是探活口径。
    # 待实测确认：Ollama 在 CPU 上冷启动加载 qwen2.5:7b 时首 token 可能超过 60s，
    # 那会表现为"第一次问必失败、第二次就好"（不是 bug）；撞上就把本值提到 120000。
    read-timeout-ms: 60000
    ollama:
      # 与 nexus.health.ollama.base-url 指向同一个环境变量，保持"环境层面单一真源"
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
      chat-path: /api/chat
      model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b}
      # ── 阶段3 新增：embedding 端点（对话与向量化是两条不同的上游路径）──
      # ✅ 2026-09-22 探针 A/B 实测：端点存在、响应形状 {"embeddings":[[...]]}、**支持批量入参**。
      # 单独做成配置项的理由：将来换 Ollama 版本时若该端点改了名字，只改这一行，
      # OllamaEmbeddingService 内部那条"退化为旧的 /api/embeddings 逐条调用"的退路也由它兜底。
      embed-path: /api/embed
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat-path: /chat/completions
      model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
      # 密钥**只能**来自环境变量（compose 的 env_file，见 docker-compose/.env.local）。
      # 为空时 DeepSeekService 启动打 warn、调用时直接返回 20100，不发无谓的网络请求
      # —— 容器缺密钥也要能照常启动（缺密钥只让"云端那半"测不了，栈永远起得来）。
      api-key: ${DEEPSEEK_API_KEY:}
    executor:
      # 专用线程池（决策 D8）：每个进行中的流占一个本池线程直到结束。
      # 注意被占用的是本池、不是 Tomcat 请求线程（emitter 返回后请求线程即释放）。
      core-size: 4
      max-size: 16        # 并发流上限
      queue-capacity: 0   # 不排队：无界队列 + 长连接 = 内存慢性泄漏；满了直接拒绝并返回 503 + 20100

    # ── RAG 知识库（阶段3；绑定见 com.nexus.module.ai.rag.config.RagProperties）──
    # ⚠️ 本块所有键**都不在** docker-compose 的 nexus-backend.environment 里（与上面 ai.* 同一类坑）：
    #    在 .env 里改它们容器收不到，只能改本文件的默认值 = **重打包 + 重启后端**（配置打进 jar）。
    rag:
      # 分块（task.4 3.3 验收点名"可配置"）：窗口 500 字、相邻块重叠 50 字 ⇒ 步长 = 500 - 50 = 450
      # ⚠️ 改这两个值之后**必须重传文档**才生效 —— 本轮不保存原始文件，无法对已入库的文档重新分块（决策 D8）。
      #    症状是"改了配置、块数却没变"，非常容易被误判成"配置没生效"
      chunk-size: 500
      chunk-overlap: 50
      # 文档上限（**不是**上传大小上限 —— 那个的唯一真源是下面 spring.servlet.multipart.max-file-size）
      # 先分块、再判上限、最后才向量化（决策 D15）：超限报 10204 在几秒内发生，
      # 而不是"把这份文档的向量全算完"才失败（那时用户看到的是一个像上游故障的超时）。
      # 量级：2 万块的 TXT ÷ 每批 16 块 × 实测 3.6 s/批 ≈ 75 分钟（算式见 ResultCode.KB_CONTENT_TOO_LARGE）
      max-chunks-per-document: 3000
      # 检索
      top-k: 5
      max-top-k: 20
      # 相似度阈值（余弦）：低于它的检索结果一律丢弃；全部低于 → grounded=false 且**不调用大模型**
      # 初值 0.5 是**起点不是结论** —— 标定五步见设计文档 §3.9（问文档里有的问题记 S_hit、
      # 问一定没有的问题记 S_miss，取 (S_miss+S_hit)/2 附近），跑完把结果写进 TC-03 备注
      score-threshold: 0.5
      # 问答生成用哪个模型（取值即 ModelType 枚举名）。默认云端：中文问答质量与速度都更好（约 4s vs CPU 上 30s+）
      # 无 DEEPSEEK_API_KEY 时选 DEEPSEEK 会直接 20100（阶段2 既定行为）；离线演示可改成 OLLAMA
      answer-model-type: DEEPSEEK
      # 问题长度上限（按**字符**计，不是字节）：与对话接口的 8KB 字节口径不同是**有意的**（契约 §7.4）——
      # 问题天然是短的，500 字符 ≈ 500 个汉字，口径简单可读即可；超出 → 40001
      max-question-length: 500
      # embedding 检索侧任务前缀（决策 D14 的机制）；**2026-09-22 起两个都置空**：
      #   这两个串（search_document: / search_query: ）是 nomic-embed-text 模型卡的建议（v1.5 口径），
      #   而 embedding 模型已换成 bge-m3 —— **bge-m3 不需要任务前缀**，留着等于给一个不期望它们的模型
      #   硬塞英文前缀，属"不报错、只是检索变差"的静默劣化，必须与换模型**同一次**改掉。
      # ⚠️ 置空必须**显式写 ""**，不能靠删掉这两行 —— 删掉会回落到 RagProperties 里的字段默认值
      #   （仍是 "search_document: " / "search_query: "），前缀会悄悄回来（同样不报错）。
      # ⚠️ 改这两个前缀（以及换 embedding 模型）都意味着**存量向量作废**：必须重灌全部文档。
      #   本轮不保存原始文件（决策 D8）⇒ 实际动作是**重新上传**；库侧由补丁
      #   db-patch/202609221100_知识库向量维度改1024.sql 清空并重建为 vector(1024)。
      # ⚠️ 两个前缀必须成对同源地改：只改一侧，等于把两侧的向量按比例拉偏（同样不报错）
      document-prefix: ""
      query-prefix: ""

  # ── 请求侧安全（阶段1；绑定见 SecurityProperties）──
  security:
    # 免鉴权路径（Ant 风格）。**除本清单外一律需要 token**（默认拒绝，不默认放行）。
    # 三条各有硬理由，删任何一条都会打断既有验收：
    #   /api/auth/login —— 登录本身不能要求先登录；
    #   /api/health     —— scripts/up.sh、check-env.sh、check-health.sh 的探活口（0.3 已验收）；
    #   /actuator/**    —— docker-compose 中 nexus-backend 的 healthcheck 探活口。
    # 与 SecurityProperties 的 Java 默认值保持一致（yml 缺失时行为不退化）。
    whitelist:
      - /api/auth/login
      - /api/health
      - /actuator/**

# ── 日志 ──
logging:
  level:
    root: info
    # 本项目包统一 info：关键流程（探活、向量入库、大模型调用）按宪法要求打 log.info
    com.nexus: info
    # ⚠️ 阶段1 的验收判据之一（1.3-1）：Mapper 包开 debug 才能看到 MyBatis 打印的最终 SQL
    #    与参数（"==>  Preparing: ... WHERE ... tenant_id = ?"），
    #    这是"任何查询都自动带租户条件"唯一可见、可截图、可演示的证据。
    #    验收通过后可改回 info（届时 SQL 日志消失，属预期）。
    com.nexus.module.system.mapper: debug
    # ⚠️ 阶段3 的验收判据之一（TC-03 §3.3-③④）：rag 的 Mapper 包同样要开 debug
    #    —— 这是"检索 SQL 真的被注入了 tenant_id"唯一可见、可截图、可演示的证据（设计 D11 的判据）。
    #    要看的是 KbChunkMapper.search 打印出来的最终 SQL 里带没带 tenant_id = ?
    #    （待实测：jsqlparser 能否改写 CAST(? AS vector) —— 设计 §9 风险 4 有退路，验证就在这一行日志上）。
    com.nexus.module.ai.rag.mapper: debug
